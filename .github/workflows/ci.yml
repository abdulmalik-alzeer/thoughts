name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this, but only when the tagged commit has no passing run of this
  # workflow yet (see the "ci-status" job in release.yml). The same commit is not tested twice.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Daemon tests, UI build and a shell compile check on every platform the app ships on.
  # Windows and Linux have not been release-tested by a person yet: these jobs are what keeps
  # them honest.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bounded and retried: a slow package mirror must not stall the job (scripts/ci/apt-install.sh).
      - name: Linux system packages (Tauri, keyring)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: >-
          bash scripts/ci/apt-install.sh
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config git
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Restored everywhere, saved from main only: a cache saved by a tag or a pull request can
      # be read by nobody else and only pushes the useful ones out of the 10 GB the repository gets.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Daemon tests
        if: runner.os != 'Windows'
        run: cargo test -p thoughtsd
      # Windows: the daemon's tests are compiled, which is what catches code that only builds on
      # Unix. They are then run without deciding the job: about fifty of them start stand-in
      # programs written as `sh` scripts and fail there for that reason alone. Make those stand-ins
      # run on Windows, then fold this back into the step above.
      - name: Daemon tests compile (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p thoughtsd --no-run
      - name: Daemon tests (Windows, not blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        run: cargo test -p thoughtsd
      - name: Build the UI
        run: npx vite build
      # Builds the desktop shell and runs its own tests (plain logic: none needs a display).
      - name: Desktop shell tests
        run: cargo test -p thoughts

  # Type and template checks for the UI, and the tests of the release pipeline's own scripts.
  ui-check:
    name: UI check (svelte-check)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Release pipeline scripts
        run: node --test scripts/release/release.test.mjs
      - run: npm ci
      - run: npm run check

  # Lints. NOT blocking yet: `cargo clippy -p thoughtsd -- -D warnings` does not pass today.
  # Remove `continue-on-error` once it does.
  clippy:
    name: Clippy (not blocking)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system packages (keyring)
        timeout-minutes: 12
        run: bash scripts/ci/apt-install.sh libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p thoughtsd -- -D warnings
