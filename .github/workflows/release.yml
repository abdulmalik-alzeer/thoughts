name: Release

# One workflow, three kinds of run (scripts/release/plan.mjs decides which):
#
#   RELEASE    push a tag like v0.0.9. Builds the installers for every platform at the same time
#              and, when all of them AND the tests have passed, attaches them to a DRAFT GitHub
#              Release. Nothing is published until a person publishes the draft.
#   REHEARSAL  "Run workflow" by hand (or `gh workflow run release.yml --ref main`). Builds every
#              installer exactly as a release would and keeps them as workflow artifacts. Creates
#              no release and no tag: no job of a rehearsal has write access to the repository.
#   WARM-UP    a push to main that changes the Rust dependencies or this file, and every Monday
#              and Thursday. Compiles (Windows and Linux only) to refresh the build caches, so the
#              next tag does not start cold: GitHub drops a cache nobody used for 7 days, and a
#              new Rust version makes the old one useless. When the cache is already current the
#              job only checks that and stops (about 6 counted runner minutes per run; delete the
#              `schedule` lines below to turn the timed runs off).
#
# Jobs:  preflight ─┬─ build (macOS | Windows | Linux, in parallel) ── assemble ─┐
#                   └─ ci-status ── tests (only if this commit has no passing CI) ─┴─ publish
#
# Every signing step is skipped when its secrets are missing, so all of this also works with no
# secrets at all (unsigned builds, updater off). See docs/RELEASING.md.
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   macOS signing       APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#   macOS notarisation  APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows signing     WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#   Updater             TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Variables (same page -> Variables):
#   UPDATER_PUBKEY      the updater PUBLIC key (not secret)
#
# Where secrets go:
#   - Signing secrets reach two steps only: "Windows signing certificate" and "Bundle and sign".
#     Both run AFTER the compile step, which is where the build code of every Rust and npm
#     dependency runs; that step gets no secret and no usable GitHub token.
#   - The build jobs can only read the repository. The one job that can write to releases
#     ("publish") runs none of the project's dependencies.
#   - Nothing secret is written to GITHUB_ENV, to an output, or to a file a later step can read.
#   - Every third-party action is pinned to a full commit SHA; .github/dependabot.yml proposes
#     updates. Inputs were checked against each action's action.yml at the pinned commit.

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Rehearsal (builds the installers, publishes nothing)' || github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Warm up the release build caches' }}

on:
  push:
    tags: ['v*']
    # Warm-up runs. `paths` only filters pushes to branches; a tag push always runs.
    branches: [main]
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - rust-toolchain
      - rust-toolchain.toml
      - .cargo/config.toml
      - .github/workflows/release.yml
  # Warm-up runs on main. Never more than 4 days apart, inside GitHub's 7-day cache expiry.
  schedule:
    - cron: '41 3 * * 1,4'
  workflow_dispatch:
    inputs:
      platforms:
        description: Installers to build (a rehearsal never publishes anything)
        type: choice
        default: all
        options: [all, macos, windows, linux]

permissions:
  contents: read

concurrency:
  # A release is never cancelled and never shares a queue with anything else. On a branch, a
  # rehearsal replaces a warm-up or an older rehearsal that is still running (it does the same
  # work and more); a warm-up waits its turn.
  group: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'release-rehearsal' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # What kind of run this is, which platforms it builds, and the checks that must fail before
  # any build minute is spent: the tag must match the version in Cargo.toml, and a release that
  # is already published is never rebuilt.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact-days: ${{ steps.plan.outputs.artifact-days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag, for the starter kit's history below.
          fetch-depth: 0
      - name: Plan this run
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: node scripts/release/plan.mjs
      # crates/thoughtsd/src/kit_history.rs must list what every earlier release's starter kit
      # shipped (docs/RELEASING.md, checklist step 2); the release's own tag is not in it.
      - name: The starter kit's history is up to date
        if: steps.plan.outputs.mode != 'warm'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/kit-history.mjs --check --before "$VERSION"
      - name: A published release is never rebuilt
        if: steps.plan.outputs.mode == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: node scripts/release/publish.mjs --check-only

  # Has the CI workflow already passed for this exact commit (the push to main ran it)? Then the
  # tests are not run a second time. Waits when that run is still going.
  ci-status:
    name: Tests already passed for this commit?
    needs: preflight
    if: needs.preflight.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tests-needed: ${{ steps.ci.outputs.tests-needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for a passing CI run
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release/ci-status.mjs

  # The whole CI workflow, when this commit has not passed it yet. Runs beside the builds.
  tests:
    name: Tests
    needs: [preflight, ci-status]
    if: needs.ci-status.outputs.tests-needed == 'true'
    uses: ./.github/workflows/ci.yml

  # One job per platform, all at once. They compile, bundle, sign, and hand their installers
  # over as a workflow artifact. They cannot write to the repository or to a release.
  build:
    name: ${{ matrix.name || 'Installers' }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Leave no GitHub token on disk for the build code of dependencies to find.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      # Release-profile build cache. A tag can read the caches saved on main but not another
      # tag's, so they are SAVED from main only (warm-up runs and rehearsals on main) and only
      # read here. The key is the same for all three kinds of run. It is saved only when the
      # whole job succeeded, so an exact hit always means a complete cache.
      - name: Restore the Rust build cache
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A warm-up run whose cache is already exact has nothing left to do.
      - name: What does this job have to do?
        id: todo
        shell: bash
        env:
          MODE: ${{ needs.preflight.outputs.mode }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          build=true; bundle=true
          if [ "$MODE" = "warm" ]; then
            bundle=false
            if [ "$CACHE_HIT" = "true" ]; then
              build=false
              echo "The release build cache for this platform is already up to date: nothing to do."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      # Bounded and retried: a slow package mirror must not stall the job (scripts/ci/apt-install.sh).
      - name: Linux system packages (Tauri, keyring)
        if: steps.todo.outputs.build == 'true' && runner.os == 'Linux'
        timeout-minutes: 12
        run: >-
          bash scripts/ci/apt-install.sh
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          libdbus-1-dev pkg-config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.todo.outputs.build == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.todo.outputs.build == 'true'

      # --- What is configured? This step only answers yes or no; no secret value enters it.
      # Updater: on only when both the public key (variable) and the private key (secret) exist.
      - name: What is configured?
        id: conf
        if: steps.todo.outputs.build == 'true'
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_NOTARISATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ -n "$UPDATER_PUBKEY" ] && [ "$HAS_UPDATER_KEY" = "true" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
            echo "Updater: on"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "Updater: off (this build will say updates are not configured)"
            if [ -n "$UPDATER_PUBKEY" ] || [ "$HAS_UPDATER_KEY" = "true" ]; then
              echo "::warning::Only one half of the updater key is configured (UPDATER_PUBKEY variable, TAURI_SIGNING_PRIVATE_KEY secret). The updater stays off."
            fi
          fi
          echo "macos-signing=$HAS_APPLE_SIGNING" >> "$GITHUB_OUTPUT"
          echo "macos-notarisation=$HAS_APPLE_NOTARISATION" >> "$GITHUB_OUTPUT"

      # Public values only (see scripts/release-config.mjs). They are compiled into the app.
      - name: Write the release config
        if: steps.todo.outputs.build == 'true'
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ steps.conf.outputs.updater == 'true' && vars.UPDATER_PUBKEY || '' }}
          UPDATER_ENDPOINT: ${{ steps.conf.outputs.updater == 'true' && format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) || '' }}
        run: node scripts/release-config.mjs

      # COMPILE. The UI build and `cargo build --release`: the build scripts and procedural macros
      # of every Rust dependency and every npm package the UI build loads run here. No secret is
      # handed to this step, and scripts/tauri-ci.mjs removes any that might be present.
      - name: Compile (no secrets in this step)
        if: steps.todo.outputs.build == 'true'
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.args }}
        run: node scripts/tauri-ci.mjs build --no-bundle --config src-tauri/release.conf.json $TAURI_ARGS

      # --- Windows: import the .pfx certificate (only when the secret exists), now that the
      # dependencies' build code has finished. The thumbprint is not secret; it is passed on as
      # a step output.
      - name: Windows signing certificate
        id: wincert
        if: steps.todo.outputs.bundle == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "Windows signing: off (unsigned build)"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            # A .pfx often carries its issuer's certificates too: sign with the one that has the key.
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          } finally {
            if (Test-Path $pfx) { Remove-Item $pfx }
          }
          if (-not $cert) { Write-Host "::error::WINDOWS_CERTIFICATE holds no certificate with a private key"; exit 1 }
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Windows signing: on"
      - name: Add Windows signing to the release config
        if: steps.wincert.outputs.thumbprint != ''
        shell: bash
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: node scripts/release-config.mjs --add-windows-signing

      # PACKAGE AND SIGN. The only step that sees the Apple and updater signing secrets. It runs
      # no dependency build code: `tauri bundle` packs what the compile step built, with the
      # system's packaging tools. scripts/tauri-ci.mjs drops the secrets that are empty or
      # incomplete before starting the Tauri CLI (an empty variable would make it try to sign and
      # fail), so the same step works with all, some or none of them. Apple secrets go to the
      # macOS job only.
      - name: Bundle and sign
        if: steps.todo.outputs.bundle == 'true'
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.args }}
          APPLE_CERTIFICATE: ${{ matrix.id == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.id == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.id == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.id == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.id == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.id == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.conf.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.conf.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node scripts/tauri-ci.mjs bundle --config src-tauri/release.conf.json $TAURI_ARGS

      # The files this platform contributes, under their release names, with sizes and checksums
      # (build-info-<platform>.json). Fails when an installer or an updater signature is missing.
      - name: Collect the installers
        if: steps.todo.outputs.bundle == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.id }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
          UPDATER: ${{ steps.conf.outputs.updater }}
          MACOS_SIGNED: ${{ steps.conf.outputs.macos-signing }}
          MACOS_NOTARIZED: ${{ steps.conf.outputs.macos-notarisation }}
          WINDOWS_SIGNED: ${{ steps.wincert.outputs.thumbprint != '' }}
        run: node scripts/release/collect.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.todo.outputs.bundle == 'true'
        with:
          name: installers-${{ matrix.id }}
          path: release-out/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.artifact-days }}
          compression-level: 0 # installers are already compressed
          overwrite: true # a re-run of this job replaces what its first attempt uploaded

  # Once, after every platform has built: checks the set of installers is complete and intact,
  # and writes the updater manifest (latest.json) from all platforms in one go. Read-only.
  assemble:
    name: Check the installers and write the update manifest
    needs: [preflight, build]
    if: needs.preflight.outputs.mode != 'warm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify the installers, write latest.json and the checksums
        env:
          MODE: ${{ needs.preflight.outputs.mode }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PLATFORMS: ${{ needs.preflight.outputs.platforms }}
        run: node scripts/release/assemble.mjs release-assets release-meta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-meta/
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.artifact-days }}
          overwrite: true

  # RELEASE runs only. Nothing reaches the release until every platform has built, the set has
  # been checked, and the tests have passed for this commit — here or in the CI run on main.
  # The only job that can write to the repository; it runs none of the project's dependencies.
  publish:
    name: Draft release
    needs: [preflight, ci-status, tests, assemble]
    if: >-
      ${{ !cancelled()
      && needs.preflight.outputs.mode == 'release'
      && needs.assemble.result == 'success'
      && needs.ci-status.result == 'success'
      && (needs.tests.result == 'success'
      || (needs.tests.result == 'skipped' && needs.ci-status.outputs.tests-needed == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: release-meta
      # Creates the draft (or reuses the one an earlier attempt left) and makes its files exactly
      # this run's. Refuses to touch a release that is already published.
      - name: Attach the installers to the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: node scripts/release/publish.mjs release-assets release-meta
