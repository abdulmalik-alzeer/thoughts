[package]
name = "thoughts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thoughts — a second-brain workstation"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Quick capture from anywhere (FEAT-12) and thoughts:// links (FEAT-38).
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
ureq = "2"
# Canonical paths without the Windows `\\?\` prefix (already in the tree through tauri).
dunce = "1"
thoughtsd = { path = "../crates/thoughtsd" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
