[package]
name = "thoughts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thoughts — a second-brain workstation"

[features]
# Only for `scripts/release/rehearse-update.mjs`: lets a throwaway copy be pointed at a pretend
# GitHub on this computer and update itself without anyone clicking. No release is built with it.
rehearsal = []
# Only for checking the screen check by hand (src/screen_check.rs `probe`): one check at start-up, then quit.
screen-check-probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Reading a drawing before it is saved (`plain_svg`): a small XML parser that refuses document types. MIT OR Apache-2.0.
roxmltree = "0.20"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Quick capture from anywhere (FEAT-12) and thoughts:// links (FEAT-38).
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
ureq = "2"
# Canonical paths without the Windows `\\?\` prefix (already in the tree through tauri).
dunce = "1"
thoughtsd = { path = "../crates/thoughtsd" }

# Tests only: the menu library Tauri uses, to check that the keyboard shortcut keys parse as menu keys
# (already in the tree through tauri, same version).
[dev-dependencies]
muda = "=0.20.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
# Blocks for the Speech and AVFoundation callbacks of voice in (already in the tree through objc2-app-kit).
block2 = "0.6"
