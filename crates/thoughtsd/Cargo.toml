[package]
name = "thoughtsd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thoughts session daemon: owns AI sessions, library, git and wraps"

[dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The YAML organization's maintained fork of serde_yaml (archived): same code, same parsing.
yaml_serde = "0.10"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "7"
rand = "0.8"
regex = "1"
walkdir = "2"
include_dir = "0.7"
futures = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
dunce = "1"
base64 = "0.23"
# Noticing changes other programs make to the library (watch.rs): FSEvents, inotify, ReadDirectoryChanges. CC0-1.0.
notify = "8"
# Text versions of attached office files for the assistant (as_text.rs). All MIT or MIT/Apache-2.0, and
# zip and quick-xml were already built for the desktop shell; calamine reads only .xlsx/.xlsb/.xls.
calamine = "0.38"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
encoding_rs = "0.8"
# Reading a screen mock-up the way a browser does before cleaning it (mado_design_clean.rs). MIT or Apache-2.0,
# and already built for the desktop shell (tauri-utils reads its pages with it): the same version, pinned.
html5ever = "=0.39.0"

[dev-dependencies]
# Builds the old-format (.xls, .ppt) test files of as_text.rs. MIT.
cfb = "0.14"

# Linux: the kernel keyring alone forgets everything at reboot, so secrets also go to the desktop's
# Secret Service (GNOME Keyring / KWallet). libdbus is built in, so no system package is needed.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }
